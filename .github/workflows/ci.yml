name: SHIP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Validate resilience test script
        run: python -m py_compile scripts/test_resilience.py

  frontend-check:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  compose-validation:
    name: Docker Compose configuration and image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml config --quiet

      - name: Build backend and frontend images
        run: docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml build ship-api frontend



  resilience-e2e:
    name: End-to-end self-healing test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SHIP_JWT_SECRET: "ci-only-ship-jwt-secret-key-for-github-actions-2026"
      SHIP_ADMIN_USERNAME: "ci-admin"
      SHIP_ADMIN_PASSWORD: "CI-only-Ship-Admin-Password-2026!"
      SHIP_ACCESS_TOKEN_EXPIRE_MINUTES: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start isolated SHIP test environment
        run: |
          docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml up -d --build postgres docker-proxy demo-service ship-api

      - name: Wait for API and demo service
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              token="$(curl -fsS -X POST http://localhost:8000/auth/login \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "username=${SHIP_ADMIN_USERNAME}" \
                --data-urlencode "password=${SHIP_ADMIN_PASSWORD}" \
                | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' 2>/dev/null)" || token=""

              if [ -n "$token" ] && \
                curl -fsS -H "Authorization: Bearer ${token}" \
                http://localhost:8000/services/demo-service |
                python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "healthy" else 1)' 2>/dev/null; then
                echo "SHIP API and demo service are ready."
                exit 0
              fi
            fi

            sleep 2
          done

          echo "SHIP did not become ready in time."
          docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml logs --no-color
          exit 1

      - name: Run end-to-end resilience test
        run: python scripts/test_resilience.py

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml logs --no-color

      - name: Clean up test environment
        if: always()
        run: docker compose --env-file .env.example -f infrastructure/compose/docker-compose.yml down -v
