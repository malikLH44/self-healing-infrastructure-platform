services:
  demo-service:
    image: nginx:alpine
    container_name: ship-demo-service
    restart: "no"
    ports:
      - "8080:80"
    networks:
      - ship-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ship-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ship-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ship:${SHIP_DB_PASSWORD}@postgres:5432/ship

    restart: "no"
    ports:
      - "8000:8000"
    volumes:
      - ../config/services.json:/app/config/services.json:ro
      - ../config/remediation-policies.json:/app/config/remediation-policies.json:ro
    networks:
      - ship-app
      - ship-docker-control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: ship-docker-proxy
    restart: "no"
    environment:
      LOG_LEVEL: info
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - ship-docker-control

  postgres:
    image: postgres:17-alpine
    container_name: ship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ship
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: ${SHIP_DB_PASSWORD:?SHIP_DB_PASSWORD must be set}
    volumes:
      - ship-postgres-data:/var/lib/postgresql/data
    networks:
      - ship-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship -d ship"]
      interval: 5s
      timeout: 3s
      retries: 5


  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ship-frontend
    restart: unless-stopped
    depends_on:
      ship-api:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - ship-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


networks:
  ship-app:
    name: ship-app

  ship-docker-control:
    name: ship-docker-control
    internal: true



volumes:
  ship-postgres-data:
