global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitors itself.
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # SHIP API exposes application metrics.
  - job_name: "ship-api"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["ship-api:8000"]
